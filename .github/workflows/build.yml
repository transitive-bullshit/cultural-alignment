name: CI

on: [push]

jobs:
  test:
    name: Test Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest

    strategy:
      fail-fast: true
      matrix:
        node-version:
          - 24

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --strict-peer-dependencies
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm content:validate
      - run: pnpm test:checks
      - run: pnpm build
        env:
          NEXT_PUBLIC_SITE_URL: http://cultural-alignment-e2e.localhost:1355
      - run: pnpm test:e2e
        env:
          NEXT_PUBLIC_SITE_URL: http://cultural-alignment-e2e.localhost:1355
          PLAYWRIGHT_SERVER: production
          PORTLESS_HTTPS: '0'
          PORTLESS_PORT: '1355'
          PORTLESS_SYNC_HOSTS: '0'

      - name: Upload Playwright failure artifacts
        if: ${{ failure() }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: playwright-failures-node-${{ matrix.node-version }}
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore
          retention-days: 7
